name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with:
          activate-environment: snowsar-ci
          auto-activate-base: false
          environment-file: environment-ci.yml
          use-mamba: true

      - name: Debug environment
        run: |
          conda run -n snowsar-ci which python
          conda run -n snowsar-ci python --version
          conda run -n snowsar-ci python -c "import sys; print(sys.path)"
          conda run -n snowsar-ci conda list | grep h5py

      - name: Run tests
        run: |
          conda run -n snowsar-ci pip install pytest
          conda run -n snowsar-ci pytest -q
